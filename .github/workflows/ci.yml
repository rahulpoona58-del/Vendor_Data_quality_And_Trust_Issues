name: CI/CD Pipeline - Vendor Data Quality Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # JOB 1: CODE QUALITY & LINTING
  # =========================================================================
  lint:
    name: Lint & Code Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Syntax and Style Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # =========================================================================
  # JOB 2: AUTOMATED TESTING & VERIFICATION
  # =========================================================================
  test:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    needs: lint

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-testing-secret-key-0000000000000000
      JWT_SECRET_KEY: ci-testing-jwt-secret-key-1111111111111111
      DATABASE_URL: sqlite:///:memory:

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Isolated Unit Tests
        run: |
          export PYTHONPATH="."
          python -m unittest discover -s tests -p "test_unit_*.py" -v

  # =========================================================================
  # JOB 3: DOCKER CONTAINER BUILD VERIFICATION
  # =========================================================================
  build-container:
    name: Build Production Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: vendor-trust-platform:latest
