<!DOCTYPE html>
<html>
<head>
    <title>Vendor Trust System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
        }

        .card {
            border-radius: 15px;
        }

        .btn-custom {
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container text-center mt-5">

    <h1 class="text-white mb-4">🚀 Vendor Trust System</h1>

    <div class="card shadow p-4">

        <form action="/result" method="post">
            <label class="form-label">Enter Vendor ID</label>
            <input type="number" name="vendor_id" class="form-control mb-3" required>
            <button class="btn btn-primary w-100 btn-custom">Check Trust Score</button>
        </form>

    </div>

    <div class="mt-4">
        <a href="/dashboard" class="btn btn-success btn-custom m-1">📊 Dashboard</a>
        <a href="/top" class="btn btn-warning btn-custom m-1">🏆 Top Vendors</a>
        <a href="/chart" class="btn btn-dark btn-custom m-1">📈 Chart</a>
    </div>

</div>

</body>
</html>
