<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Semantic Search Console</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #080c14;
            --card-bg: rgba(19, 29, 51, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f6fa;
            --text-secondary: #8c9cb5;
            --cyan-glow: #00f2fe;
            --purple-glow: #8e2de2;
            --success-glow: #00e396;
            --danger-glow: #ff4560;
            --info-glow: #00b8ff;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(142, 45, 226, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.07) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 40px;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .glass-card:hover {
            border-color: rgba(0, 242, 254, 0.25);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.08);
        }

        .accent-text-glow {
            background: linear-gradient(to right, #00f2fe, #8e2de2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
        }

        .similarity-tag {
            font-size: 0.72rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            background: rgba(0, 242, 254, 0.15);
            color: var(--cyan-glow);
            border: 1px solid rgba(0, 242, 254, 0.2);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg border-bottom border-secondary border-opacity-10 mb-4 px-4 py-3 glass-card" style="border-radius: 0 0 16px 16px;">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
                <span class="fs-4 fw-bold accent-text-glow">🔍 SEMANTIC SEARCH CONSOLE</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="btn btn-sm btn-outline-secondary" href="/dashboard"><i class="bi bi-arrow-left"></i> Registry Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container px-4 flex-grow-1 d-flex flex-column">
        <!-- Search bar layout -->
        <div class="glass-card p-4 mb-4">
            <div class="row g-3">
                <div class="col-md-7">
                    <label class="form-label text-secondary small">NATURAL LANGUAGE QUERY:</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white" id="search-input" placeholder="e.g. Find high risk vendors from Delhi NCR or expired GST certs...">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary small">FILTER TYPE:</label>
                    <select class="form-select bg-dark border-secondary text-white" id="type-selector">
                        <option value="All">All Categories</option>
                        <option value="Vendor">Vendors</option>
                        <option value="Document">Documents</option>
                        <option value="Audit Log">Audit Logs</option>
                        <option value="Compliance">Compliance filings</option>
                        <option value="Investigation">Investigations</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100 fw-bold py-2" onclick="performSemanticSearch()"><i class="bi bi-search"></i> Search</button>
                </div>
            </div>
        </div>

        <div class="row g-4 flex-grow-1">
            <!-- Left: Primary Hits -->
            <div class="col-md-7 d-flex flex-column">
                <div class="glass-card p-4 flex-grow-1 d-flex flex-column">
                    <h5 class="text-white fw-bold mb-3"><i class="bi bi-bullseye text-cyan"></i> Primary Semantic Matches</h5>
                    <div class="flex-grow-1 overflow-y-auto" id="primary-hits-container" style="max-height: 500px;">
                        <p class="text-secondary small">Enter query string parameters above to perform TF-IDF text similarity matching.</p>
                    </div>
                </div>
            </div>

            <!-- Right: Alternative similar matches -->
            <div class="col-md-5 d-flex flex-column">
                <div class="glass-card p-4 flex-grow-1 d-flex flex-column">
                    <h5 class="text-white fw-bold mb-3"><i class="bi bi-bezier2 text-purple"></i> Alternative Similar Matches</h5>
                    <div class="flex-grow-1 overflow-y-auto" id="similar-hits-container" style="max-height: 500px;">
                        <p class="text-secondary small">Alternative similarity vector mappings will appear here.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripting semantic search logic -->
    <script>
        const token = localStorage.getItem('dashboard_token') || localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/dashboard';
        }

        async function performSemanticSearch() {
            const query = document.getElementById('search-input').value;
            const type = document.getElementById('type-selector').value;

            if (!query) return;

            const primaryBox = document.getElementById('primary-hits-container');
            const similarBox = document.getElementById('similar-hits-container');

            primaryBox.innerHTML = `
                <div class="text-center py-4">
                    <div class="spinner-border text-info" role="status"></div>
                    <p class="text-secondary small mt-2">Computing TF-IDF matrices similarity scores...</p>
                </div>
            `;
            similarBox.innerHTML = "";

            try {
                const response = await fetch(`/api/v2/search/semantic?query=${encodeURIComponent(query)}&type=${type}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    // Render Primary Hits
                    primaryBox.innerHTML = "";
                    if (data.results.length === 0) {
                        primaryBox.innerHTML = `<p class="text-secondary small">No primary matches found above threshold level.</p>`;
                    } else {
                        data.results.forEach(item => {
                            primaryBox.innerHTML += `
                                <div class="p-3 mb-3 bg-dark bg-opacity-40 rounded-3 border border-secondary border-opacity-10">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="badge bg-secondary">${item.type}</span>
                                        <span class="similarity-tag"><i class="bi bi-activity"></i> Similarity: ${item.similarity_score}</span>
                                    </div>
                                    <strong class="text-white d-block mt-2">${item.title}</strong>
                                    <p class="text-secondary small mb-0 mt-1">${item.description}</p>
                                </div>
                            `;
                        });
                    }

                    // Render Alternative Similar Matches
                    similarBox.innerHTML = "";
                    if (data.similar_results.length === 0) {
                        similarBox.innerHTML = `<p class="text-secondary small">No alternative similarity overlaps found.</p>`;
                    } else {
                        data.similar_results.forEach(item => {
                            similarBox.innerHTML += `
                                <div class="p-2 mb-2 bg-dark bg-opacity-20 rounded-3 border border-secondary border-opacity-10 small">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="text-cyan fw-bold" style="font-size: 0.72rem;">${item.type}</span>
                                        <span class="text-secondary" style="font-size: 0.7rem;"><i class="bi bi-activity"></i> Sim: ${item.similarity_score}</span>
                                    </div>
                                    <strong class="text-white d-block mt-1">${item.title}</strong>
                                    <p class="text-secondary mb-0 mt-1" style="font-size: 0.75rem;">${item.description}</p>
                                </div>
                            `;
                        });
                    }
                }
            } catch (err) {
                console.error("Error executing semantic search:", err);
                primaryBox.innerHTML = `<p class="text-danger small">Network execution error.</p>`;
            }
        }
    </script>
</body>
</html>
