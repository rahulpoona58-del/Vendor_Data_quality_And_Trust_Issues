version: '3.8'

services:
  # 1. REVERSE PROXY & SSL TERMINATION (Nginx)
  nginx:
    image: nginx:1.25-alpine
    container_name: vendor_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/app/static:ro
    networks:
      - vendor_net
    depends_on:
      web:
        condition: service_healthy

  # 2. APPLICATION SERVICE (Flask / Gunicorn)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendor_trust_app
    restart: unless-stopped
    expose:
      - "5000"
      - "5001"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=container_production_secret_key_change_me
      - JWT_SECRET_KEY=container_jwt_secret_key_change_me
      - DATABASE_URL=postgresql://vendor_user:vendor_secure_db_password_123@db:5432/vendor_trust
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - app_data:/app/instance
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - vendor_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v2/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 3. DATABASE SERVICE (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: vendor_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendor_trust
      POSTGRES_USER: vendor_user
      POSTGRES_PASSWORD: vendor_secure_db_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vendor_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor_user -d vendor_trust"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 4. CACHE & MESSAGING SERVICE (Redis)
  redis:
    image: redis:7-alpine
    container_name: vendor_redis_cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - vendor_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  vendor_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_data:
  app_uploads:
  app_logs:
