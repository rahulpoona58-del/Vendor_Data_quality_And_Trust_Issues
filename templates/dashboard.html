<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #43e97b, #38f9d7);
        }

        .table-hover tbody tr:hover {
            background-color: #d1f7c4;
            transform: scale(1.01);
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">📊 Vendor Dashboard</h2>

        <input type="text" id="search" class="form-control mb-3" placeholder="🔍 Search vendor..." onkeyup="filterTable()">

        <table class="table table-hover table-bordered text-center">
            <tr class="table-dark">
                <th>ID</th>
                <th>Name</th>
                <th>Score</th>
                <th>Level</th>
            </tr>

            {% for v in vendors %}
            <tr>
                <td>{{ v.vendor_id }}</td>
                <td>{{ v.vendor_name }}</td>
                <td>{{ v.trust_score }}</td>
                <td>
                    <span class="badge 
                        {% if v.trust_level == 'High Trust' %}bg-success
                        {% elif v.trust_level == 'Medium Trust' %}bg-warning
                        {% else %}bg-danger{% endif %}">
                        {{ v.trust_level }}
                    </span>
                </td>
            </tr>
            {% endfor %}
        </table>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-dark">⬅ Back</a>
        </div>

    </div>

</div>

<script>
function filterTable() {
    let input = document.getElementById("search").value.toLowerCase();
    let rows = document.querySelectorAll("table tr");

    rows.forEach((row, i) => {
        if(i === 0) return;
        row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
    });
}
</script>

</body>
</html>
